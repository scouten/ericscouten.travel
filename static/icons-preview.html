<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track map icons (temporary preview)</title>
<link rel="stylesheet" href="https://use.typekit.net/hwf0fzd.css">
<style>
  body { margin: 0; padding: 2rem 1rem 4rem; background: #212126; color: #e6e5e9; font-family: expo-sans-pro, sans-serif; }
  h1 { font-size: 1.2rem; font-weight: 600; margin: 0 0 .25rem; }
  p.note { color: #9b9ba6; font-size: .9rem; margin: 0 0 2rem; max-width: 40rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; max-width: 1400px; }
  .card { background: #1c1c21; border: 1px solid rgba(255,255,255,.13); border-radius: 12px; padding: 1rem; display: grid; grid-template-columns: 1fr auto; gap: .75rem 1rem; align-items: center; }
  .caption { display: flex; align-items: center; gap: .55rem; font-size: .85rem; line-height: 1.25; }
  .caption .ico { width: 1.25rem; height: 1.25rem; color: #f2a65a; display: inline-flex; }
  .caption .ico svg { width: 100%; height: 100%; }
  .caption .text { display: flex; flex-direction: column; }
  .caption .mode { font-weight: 600; }
  .caption .label { color: #9b9ba6; font-size: .78rem; }
  .big { width: 64px; height: 64px; color: #f2a65a; grid-row: 1 / span 2; }
  .big svg { width: 100%; height: 100%; }
  .token { grid-column: 1; color: #6b6c75; font-size: .75rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .token b { color: #9b9ba6; font-weight: 600; }
  .new { display: inline-block; margin-left: .5rem; padding: 0 .4rem; border-radius: 999px; background: #9c6128; color: #fff; font-size: .65rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-family: expo-sans-pro, sans-serif; }
</style>
</head>
<body>
<h1>Track map icons</h1>
<p class="note">Every mode glyph in the theme's set, rendered from the live script. Left: at caption size, as it appears in the widget's status bar. Right: enlarged for inspection. Temporary page; not linked from the site.</p>
<div class="grid" id="grid"></div>
<script src="/common/track-map.js"></script>
<script>
(function () {
  const T = window.esTrackIcons;
  const grid = document.getElementById('grid');
  if (!T) { grid.textContent = 'The track-map script did not expose its icons.'; return; }
  const NEW = ['taxi', 'ferry', 'tram', 'horse', 'kayak', 'helicopter'];
  const SAMPLE = { stop: ['Cape Point', ''], fly: ['Flying · 13,580 km / 8,439 mi · 14 h 15 min', 'ATL → CPT'] };
  const rows = Object.keys(T.MODES).map(k => [k, T.MODES[k]]).concat([['(none)', { name: '', icon: 'route' }]]);
  rows.forEach(([token, m]) => {
    const card = document.createElement('div'); card.className = 'card';
    const head = SAMPLE[token] ? SAMPLE[token][0] : `${m.name ? m.name + ' · ' : ''}12 km / 7.5 mi`;
    const sub = SAMPLE[token] ? SAMPLE[token][1] : 'Somewhere → Somewhere else';
    card.innerHTML = `
      <div class="caption"><span class="ico">${T.iconSvg(m.icon)}</span><span class="text"><span class="mode">${head}</span>${sub ? `<span class="label">${sub}</span>` : ''}</span></div>
      <div class="big">${T.iconSvg(m.icon)}</div>
      <div class="token"><b>${token}</b> · glyph <b>${m.icon}</b>${NEW.includes(token) ? '<span class="new">new</span>' : ''}</div>`;
    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
